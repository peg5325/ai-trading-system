# KRX 정규장 Paper Trading 운영 설정 — Official Session #002 (2026-07-08)
#
# 자금관리 v1. KR 종목(KRW). 실주문 없음(PaperBrokerProvider). market 은 통화로 자동 추론(KRW→KR).
# US Session(#001) 및 오전 preflight 데이터와 섞지 않기 위해 *_krx_s002.sqlite fresh namespace 사용.
# Universe 는 추후 변경 가능하도록 유지(symbols 만 교체).
symbols:
  - "005930"   # 삼성전자
  - "000660"   # SK하이닉스
  - "402340"   # SK스퀘어

poll_interval_s: 20
initial_capital: 3000000        # 초기자본 3,000,000 KRW (fresh portfolio)
entry_notional_pct: 0.20        # 종목당 최대 20%
max_positions: 2                # 동시 최대 2종목
account_value: 3000000          # 후방호환(레거시) — 런타임은 initial_capital 사용
fetch_spacing_s: 0.5            # 종목간 시세 호출 간격(429 완화). 3종목×0.5s=1.5s < poll 20s
max_calls_per_session: 300

paper_broker:                    # 실주문 없음 — PaperBrokerProvider 만
  slippage_bps: 5
  fee_bps: 2

ai:
  provider: fake                 # FakeAI(항상 APPROVE) — OpenAI 호출 금지
  model: gpt-5.5-mini

journal:
  db: data/journal_krx_s002.sqlite
candles:
  db: data/market_krx_s002.sqlite
review:
  db: data/reviews_krx_s002.sqlite
metrics:
  db: data/metrics_krx_s002.sqlite
system_review:
  db: data/system_reviews_krx_s002.sqlite

logging:
  dir: runs/paper_2026-07/krx_s002/logs
  max_bytes: 1000000
  backup_count: 3

reports_dir: runs/paper_2026-07/krx_s002/reports
status_path: runs/paper_2026-07/krx_s002/status.json
