# Historical event calendar for the v1.1 draft backtest (intraday reversal S6).
# Purpose: BACKTEST ONLY. Not used by the live runner; the live runner reads
# daytrade_events_v1.yaml. Same schema as daytrade_events_v1.yaml.
# Sources checked on 2026-10-07 (pages listed per entry). Dates outside `coverage` are unknown.
#
# Rules:
#   FOMC        = decision day (second day) of every SCHEDULED two-day FOMC meeting.
#                 Unscheduled calls are excluded unless a policy decision was announced
#                 (none in coverage). The 2025-08-22 notation vote (Statement on Longer-Run
#                 Goals and Monetary Policy Strategy, no rate decision) is NOT an event.
#   CPI / NFP / PCE = ACTUAL release day (BLS CPI, BLS Employment Situation, BEA Personal
#                 Income and Outlays). 08:30 ET unless the title says otherwise.
#                 CPI/NFP dates come from the BLS archive link names (cpi_MMDDYYYY,
#                 empsit_MMDDYYYY); PCE dates and times from the BEA embargo lines.
#   EARLY_CLOSE = NYSE 1:00 p.m. early close.
#   holidays    = NYSE full-day closures inside coverage (weekdays only). They match
#                 src/history/exchange_calendar.py for 2023-04..2026-01.
#   An event can fall on a holiday (the release still happened while NYSE was closed);
#   the backtest only evaluates trading days, so such entries have no trading effect.
#
# 2025 US government shutdown (Oct 1 - Nov 12, 2025):
#   - CPI October 2025: NOT published (BLS did not collect October survey data). No event.
#   - Employment Situation October 2025: NOT published as a release; October payroll
#     estimates came out with the November report on 2025-12-16. No separate event.
#   - CPI September 2025 released 2025-10-24 (during the shutdown); NFP September 2025
#     released 2025-11-20; NFP November 2025 2025-12-16; CPI November 2025 2025-12-18.
#   - PIO September 2025 released 2025-12-05 10:00 ET; PIO October+November 2025 combined
#     released 2026-01-22 10:00 ET. The 2025-12-23 "Personal Income and Outlays, Data
#     Update, September 2025" was a data-only revision issued alongside Q3 GDP, not a
#     news release, and is NOT an event.
