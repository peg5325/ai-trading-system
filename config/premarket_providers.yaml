schema: premarket-provider-config/v1

http:
  allowed_hosts:
    - api.marketaux.com
    - data.sec.gov
    - api.stlouisfed.org
  timeout_seconds: 10
  max_response_bytes: 2000000
  max_retries: 2
  retry_backoff_seconds: 1
  max_retry_after_seconds: 30

marketaux:
  enabled: true
  base_url: https://api.marketaux.com/v1/news/all
  # Project hard cap. Never raise above 60 without a separately reviewed change.
  daily_limit: 60
  lookback_minutes: 180
  max_articles: 3
  # Together these cannot exceed the project 60/day hard cap.
  max_pages_by_stage:
    PRIMARY: 30
    VERIFICATION: 20
    FREEZE: 10

sec_edgar:
  enabled: true
  base_url: https://data.sec.gov/submissions
  # Deliberately stricter than the SEC fair-access ceiling.
  requests_per_second: 2
  forms: [8-K, 10-Q, 10-K]
  symbol_ciks:
    AAPL: "0000320193"
    AMD: "0000002488"
    AMZN: "0001018724"
    AVGO: "0001730168"
    CRM: "0001108524"
    GOOGL: "0001652044"
    META: "0001326801"
    MSFT: "0000789019"
    MU: "0000723125"
    NFLX: "0001065280"
    NVDA: "0001045810"
    PLTR: "0001321655"
    TSLA: "0001318605"
    VST: "0001692819"

fred:
  enabled: true
  base_url: https://api.stlouisfed.org/fred/series/observations
  release_dates_url: https://api.stlouisfed.org/fred/releases/dates
  # Fixed allowlist: additions change the evidence contract and require review.
  series:
    - {series_id: VIXCLS, label: "CBOE Volatility Index close", max_age_days: 7}
    - {series_id: DGS10, label: "10-Year Treasury constant maturity rate", max_age_days: 7}
    - {series_id: DFF, label: "Effective federal funds rate", max_age_days: 7}
    # H.10 publishes batches of daily values; the latest observation can be
    # 10 calendar days old before the next normal release after a long weekend.
    - series_id: DTWEXBGS
      label: "Trade Weighted U.S. Dollar Index"
      max_age_days: 14
      freshness_reason: "H.10 batches daily observations on a delayed release cadence"
    - series_id: CPIAUCSL
      label: "Consumer Price Index"
      max_age_days: 45
      freshness_reason: "monthly release cadence"
    - series_id: PAYEMS
      label: "All Employees, Total Nonfarm"
      max_age_days: 45
      freshness_reason: "monthly release cadence"
    - series_id: UNRATE
      label: "Unemployment Rate"
      max_age_days: 45
      freshness_reason: "monthly release cadence"
    - series_id: ICSA
      label: "Initial Claims"
      max_age_days: 14
      freshness_reason: "weekly release cadence"
