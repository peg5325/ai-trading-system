schema: premarket-config/v1
required_source_kinds:
  - MARKET
  - NEWS
source_freshness_minutes: 180
source_freshness_minutes_by_kind:
  FILING: 1440
primary_offset_minutes: 90
verification_offset_minutes: 30
freeze_offset_minutes: 20
max_candidates: 3
min_liquidity_score: 0.50
min_catalyst_score: 0.00
# v1.3 (user decision 2026-10-02, prospective only): a NEWS article counts as
# catalyst/evidence for a symbol only if its title mentions that ticker or
# company/fund name core (rule: src/premarket/providers/marketaux.py,
# docs/research/PREMARKET_NORMALIZATION_CONTRACT.md). FILING events unaffected.
news_title_relevance_required: true
universe_path: universe_p0_us30.yaml

# 직접 LONG/SHORT 방향과 inverse ETF 방향이 중첩되지 않게 제외한다.
excluded_universe_classes:
  - inverse_etf

# LONG allowlist. Activated 2026-10-01 only together with the validated first-session receipt
# docs/research/PREREG_PREMARKET_FREEZE_LONG_PAPER_V1_FIRST_SESSION_RECEIPT.json (Paper only).
# Briefs stay executable=false / orders=[]; the Paper runner refuses to run without that receipt.
# 2026-10-02 사용자 결정: 전략 원점 재검토 동안 Paper를 일시 중지한다(v1.3 세션 실행 전).
# 목록을 비우면 이 파일 해시가 영수증과 달라져 freeze-paper 러너는 NOT_ACTIVATED로 끝난다.
approved_strategy_templates: []
# 숏 가능 전략은 롱 승인에서 상속하지 않고 별도로 승인한다.
approved_short_strategy_templates: []

weights:
  catalyst_score: 0.30
  trend_score: 0.25
  relative_strength_score: 0.20
  volume_score: 0.15
  liquidity_score: 0.10
