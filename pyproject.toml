[project]
name = "ai-trading-system"
version = "0.1.0"
description = "AI 보조 다종목 자동매매 시스템 (Paper Trading 전용)"
requires-python = ">=3.10"

# 런타임 핵심 의존성. 상세/주석은 requirements.txt 참고(단일 소스는 requirements.txt).
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "websockets>=14",
]

[project.optional-dependencies]
# 실제 AI entry filter 호출 시에만 필요(테스트는 FakeAIProvider 사용).
ai = ["openai>=1.0"]
# Dataset Builder 의 Parquet export 시에만 필요.
parquet = ["pyarrow>=15"]
# 테스트.
dev = ["pytest>=8.0"]
